name: Publish rolling release

on:
  workflow_run:
    workflows:
      - Build OpenWrt packages
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish latest successful main build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    concurrency:
      group: publish-rolling-release
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - name: Select latest successful build
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          source_run="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?branch=main&event=push&status=success&per_page=100" |
            jq -r '[.[].workflow_runs[]] | max_by(.run_number) | select(.id != null) | [.id, .head_sha] | @tsv')"
          if [ -z "$source_run" ]; then
            echo "No successful main push build is available" >&2
            exit 1
          fi

          IFS=$'\t' read -r source_run_id source_sha <<< "$source_run"
          makefile="$(gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/${GITHUB_REPOSITORY}/contents/kixdns/Makefile?ref=${source_sha}")"
          core_sha="$(sed -n 's/^PKG_SOURCE_VERSION:=//p' <<< "$makefile")"
          if ! [[ "$core_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid KixDNS core commit in build source: $core_sha" >&2
            exit 1
          fi

          short_sha="${source_sha:0:7}"
          core_short_sha="${core_sha:0:7}"
          release_title="Rolling build (${short_sha}, core ${core_short_sha})"
          notes_path="${RUNNER_TEMP}/rolling-release-notes.md"
          cat > "$notes_path" <<EOF
          Rolling packages built from [\`${source_sha}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${source_sha}).

          - KixDNS core commit: [\`${core_sha}\`](https://github.com/olicesx/kixdns/commit/${core_sha})
          - OpenWrt versions: 24.10 and 25.12
          - Architectures: x86_64, aarch64_generic and aarch64_cortex-a53
          - [Build workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${source_run_id})

          This prerelease is updated automatically after relevant changes are merged into \`main\`.
          EOF

          {
            echo "run_id=$source_run_id"
            echo "sha=$source_sha"
            echo "core_sha=$core_sha"
            echo "title=$release_title"
            echo "notes_path=$notes_path"
          } >> "$GITHUB_OUTPUT"
          echo "Selected build run $source_run_id for package commit $source_sha and core commit $core_sha"

      - name: Check rolling release order
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail

          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          main_status="$(gh api \
            "repos/${GITHUB_REPOSITORY}/compare/${SOURCE_SHA}...${main_sha}" \
            --jq .status)"
          case "$main_status" in
            identical|ahead) ;;
            *)
              echo "Selected build commit $SOURCE_SHA is not part of the current main history ($main_status)" >&2
              exit 1
              ;;
          esac

          publish=true
          if current_rolling_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/rolling" --jq .sha 2>/dev/null)"; then
            rolling_status="$(gh api \
              "repos/${GITHUB_REPOSITORY}/compare/${SOURCE_SHA}...${current_rolling_sha}" \
              --jq .status)"
            case "$rolling_status" in
              ahead)
                echo "Skipping rolling publication because $current_rolling_sha is newer than $SOURCE_SHA"
                publish=false
                ;;
              identical|behind) ;;
              diverged)
                echo "Replacing rolling commit $current_rolling_sha because it is outside the current main history"
                ;;
              *)
                echo "Cannot safely update rolling: commit comparison returned $rolling_status" >&2
                exit 1
                ;;
            esac
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        if: steps.guard.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          pattern: kixdns_*
          path: release-artifacts
          merge-multiple: true

      - name: Validate build artifacts
        if: steps.guard.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          assets=(release-artifacts/*.tar.gz)
          if [ "${#assets[@]}" -ne 6 ]; then
            echo "Expected 6 rolling release assets, found ${#assets[@]}" >&2
            printf '  %s\n' "${assets[@]}" >&2
            exit 1
          fi

      - name: Publish rolling packages
        if: steps.guard.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: rolling
          target_commitish: ${{ steps.source.outputs.sha }}
          name: ${{ steps.source.outputs.title }}
          body_path: ${{ steps.source.outputs.notes_path }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release-artifacts/*.tar.gz

      - name: Move rolling tag to the published build
        if: steps.guard.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/rolling" \
            -f sha="$SOURCE_SHA" \
            -F force=true >/dev/null

      - name: Verify rolling release
        if: steps.guard.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          CORE_SHA: ${{ steps.source.outputs.core_sha }}
          RELEASE_TITLE: ${{ steps.source.outputs.title }}
        run: |
          set -euo pipefail

          published_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/rolling" --jq .object.sha)"
          if [ "$published_sha" != "$SOURCE_SHA" ]; then
            echo "Rolling tag points to $published_sha instead of $SOURCE_SHA" >&2
            exit 1
          fi

          published_release="$(gh release view rolling --json name,body,isPrerelease,assets)"
          published_title="$(jq -r .name <<< "$published_release")"
          published_body="$(jq -r .body <<< "$published_release")"
          is_prerelease="$(jq -r .isPrerelease <<< "$published_release")"
          asset_count="$(jq '.assets | length' <<< "$published_release")"

          test "$published_title" = "$RELEASE_TITLE" || {
            echo "Rolling release title does not identify the selected package and core commits" >&2
            exit 1
          }
          grep -Fq "$CORE_SHA" <<< "$published_body" || {
            echo "Rolling release notes do not identify KixDNS core commit $CORE_SHA" >&2
            exit 1
          }
          test "$asset_count" -eq 6 || {
            echo "Rolling release contains $asset_count assets instead of 6" >&2
            exit 1
          }
          test "$is_prerelease" = true || {
            echo "Rolling release is not marked as a prerelease" >&2
            exit 1
          }
