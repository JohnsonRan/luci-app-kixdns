name: Build OpenWrt packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "kixdns/**"
      - "luci-app-kixdns/**"
      - "Justfile"
      - ".github/workflows/build.yml"
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build-core:
    name: Build core ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Cache core build data
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            .cache/kixdns-core/target/${{ matrix.arch }}
            .cache/kixdns-core/zigbuild
          key: zigbuild-v3-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('kixdns/Makefile', 'Justfile') }}
          restore-keys: |
            zigbuild-v3-${{ runner.os }}-${{ matrix.arch }}-

      - name: Install core build toolchain
        run: just setup-ci

      - name: Build static musl binary
        run: just core-build "${{ matrix.arch }}"

      - name: Verify static binary
        run: just core-verify "${{ matrix.arch }}"

      - name: Upload core binary
        uses: actions/upload-artifact@v7
        with:
          name: kixdns-core-${{ matrix.arch }}
          path: dist/core/kixdns-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  build-packages:
    name: Build OpenWrt ${{ matrix.release.name }} / ${{ matrix.arch.name }}
    needs: build-core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release:
          - name: "24.10"
            sdk: openwrt-24.10
            package_ext: ipk
          - name: "25.12"
            sdk: master
            package_ext: apk
        arch:
          - name: x86_64
            core: x86_64
          - name: aarch64_generic
            core: aarch64
          - name: aarch64_cortex-a53
            core: aarch64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Download prebuilt core
        uses: actions/download-artifact@v8
        with:
          name: kixdns-core-${{ matrix.arch.core }}
          path: kixdns/prebuilt

      - name: Prepare prebuilt core
        run: just core-stage "${{ matrix.arch.core }}"

      - name: Build packages
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch.name }}-${{ matrix.release.sdk }}
          FEEDNAME: kixdns
          PACKAGES: kixdns luci-app-kixdns
          NO_REFRESH_CHECK: true

      - name: Package build output
        run: >-
          just package-output
          "${{ matrix.arch.name }}"
          "${{ matrix.release.name }}"
          "${{ matrix.release.package_ext }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: kixdns_${{ matrix.arch.name }}-openwrt-${{ matrix.release.name }}
          path: kixdns_${{ matrix.arch.name }}-openwrt-${{ matrix.release.name }}.tar.gz
          if-no-files-found: error

  upload-release:
    name: Attach packages to release
    if: github.event_name == 'release'
    needs: build-packages
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: kixdns_*
          path: release-assets
          merge-multiple: true

      - name: Attach packages to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: release-assets/*.tar.gz
          fail_on_unmatched_files: true
